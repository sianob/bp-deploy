apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: salob79/bp-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: /api
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  # type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
