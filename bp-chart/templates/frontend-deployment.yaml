---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name | default "frontend" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.frontend.name | default "frontend" }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas | default 1 }}
  {{- else }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name | default "frontend" }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name | default "frontend" }}
    spec:
      containers:
        - name: {{ .Values.frontend.name | default "frontend" }}
          image: {{ .Values.image.frontend }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.port | default 80 }}
          env:
            - name: VITE_API_BASE_URL
              value: {{ .Values.frontend.apiBaseUrl | default "/api" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.frontend.name | default "frontend" }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.frontend.name | default "frontend" }}
  ports:
    - port: {{ .Values.service.frontend.port | default 80 }}
      targetPort: {{ .Values.frontend.port | default 80 }}
