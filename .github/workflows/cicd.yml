name: Continuous Integration and Deployment
permissions:
  contents: write  # Grant write permissions for the entire workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - prod-canary
          - prod-stable

  workflow_call:
    inputs:
      environment:
        required: false
        type: string

jobs:
  frontend:
    uses: sianob/bp-frontend/.github/workflows/frontend-cicd.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}


 