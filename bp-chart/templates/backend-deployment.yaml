---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name | default "backend" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backend.name | default "backend" }}
spec:
  replicas: {{ .Values.backend.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.backend.name | default "backend" }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name | default "backend" }}
    spec:
      containers:
        - name: {{ .Values.backend.name | default "backend" }}
          image: {{ .Values.image.backend }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.backend.port | default 8080 }}
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: {{ .Values.backend.mongoUri | default "mongodb://mongodb:27017/bp" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.backend.name | default "backend" }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.backend.name | default "backend" }}
  ports:
    - port: {{ .Values.service.backend.port | default 8080 }}
      targetPort: {{ .Values.backend.port | default 8080 }}
