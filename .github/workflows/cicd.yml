name: Continuous Integration and Deployment
permissions:
  contents: write  # Grant write permissions for the entire workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - prod-canary
          - prod-stable
      trigger:
        description: 'Choose environment to deploy to'
        required: false
        type: choice
        options:
          - 
          - frontend
          - backend

  workflow_call:
    inputs:
      environment:
        required: false
        type: string
      trigger:
        required: false
        type: string

jobs:
  frontend:
    if: ${{ github.event.inputs.trigger == 'frontend' || github.event.inputs.trigger == '' }}
    uses: sianob/bp-frontend/.github/workflows/frontend-cicd.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  backend:
    if: ${{ github.event.inputs.trigger == 'backend' || github.event.inputs.trigger == '' }}
    uses: sianob/bp-backend/.github/workflows/backend-cicd.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  iac:
    needs: [frontend, backend]
    if: |
      needs.frontend.result == 'success' || needs.backend.result == 'success'  
    uses: sianob/bp-iac/.github/workflows/deploy.yml@main
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}         

  deploy:
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://staging.bp-calculator.com
    needs: [frontend, backend]
    if: |
      needs.frontend.result == 'success' || needs.backend.result == 'success'
    runs-on: ubuntu-latest
    steps:

      - name: Get and bump latest release version
        run: |
          set -e

          # Try to get the latest tag, fallback to v0.0.0 if none exists
          latest_tag=$(gh release list --repo sianob/bp-deploy --limit 1 --json tagName --jq '.[0].tagName' || echo "")

          if [[ -z "$latest_tag" ]]; then
            echo "No previous release found. Using v0.0.0"
            version="0.0.0"
          else
            echo "Latest tag: $latest_tag"
            version="${latest_tag#v}"  # remove 'v'
          fi

          # Split version and increment patch
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_version="v$major.$minor.$patch"

          echo "New version: $new_version"
          echo "VERSION=$new_version" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}


      - name: Create GitHub Release
        run: |
          echo "Creating release ${{ env.VERSION }} in sianob/bp-deploy..."
          gh release create "${{ env.VERSION }}" \
            --repo "sianob/bp-deploy" \
            --title "${{ env.VERSION }}" \
            --notes "[frontend: ${{ needs.frontend.outputs.image_tag }}](https://github.com/sianob/bp-frontend/releases/tag/${{ needs.frontend.outputs.image_tag }})"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}