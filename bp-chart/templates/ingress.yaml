apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name | default "bp-ingress" }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    {{- if .Values.ingress.canary }}
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "{{ .Values.ingress.canaryWeight | default "10" }}"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: tls-secret
  rules:
    # - host: {{ .Values.ingress.host }}  
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.frontend.name | default "frontend" }}
                port:
                  number: {{ .Values.service.frontend.port | default 80 }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.service.backend.name | default "backend" }}
                port:
                  number: {{ .Values.service.backend.port | default 8080 }}
