namespace: bp-prod
nameOverride: bp-stable
image:
  backend: salob79/bp-backend:v1.0.11
  frontend: salob79/bp-frontend:v2.0.17
  mongo: mongo:7
mongo:
  enabled: true
  pvcName: mongo-pvc
  pvcSize: 5Gi
  storageClass: managed-csi
ingress:
  host: prod.bp-calculator.com
  name: bp-ingress
  className: nginx
  canary: false
service:
  frontend:
    name: frontend
    port: 80
  backend:
    name: backend
    port: 8080
backend:
  name: backend
  replicas: 2
  port: 8080
  mongoUri: mongodb://mongo:27017/bp
frontend:
  name: frontend
  replicas: 2
  port: 80
  apiBaseUrl: /api
autoscaling:
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
